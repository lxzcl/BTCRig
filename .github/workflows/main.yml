name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish packaged builds to GitHub Releases"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - dev
    paths:
      - ".github/workflows/main.yml"
      - "src/**"
      - "CMakeLists.txt"
      - "VERSION"
      - "*.sh"
      - "*.json"
      - "README*.md"
      - "BUILD_*.md"
      - "PROXY*.md"

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libjansson-dev \
            libssl-dev \
            ocl-icd-opencl-dev \
            opencl-headers \
            pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBTC_MINER_NATIVE=OFF -DBTCRIG_OPENCL=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Smoke test
        run: |
          ./build/btc_stratum --version
          ./build/btc_proxy --version
          ./build/btc_bench --version
          ./build/btc_stratum --self-test
          ! ldd build/btc_stratum | grep -qi "libOpenCL"
          ! ldd build/btc_bench | grep -qi "libOpenCL"

      - name: Package
        run: |
          set -euo pipefail
          dist="BTCRig-v${{ steps.version.outputs.version }}-linux-x86_64"
          rm -rf "$dist" "$dist.tar.gz"
          mkdir -p "$dist"

          cp build/btc_stratum "$dist/"
          cp build/btc_proxy "$dist/"
          cp build/btc_bench "$dist/"
          cp config.json proxy.json "$dist/"
          cp README.md README.zh-CN.md PROXY.md PROXY.zh-CN.md LICENSE VERSION "$dist/"

          tar -czf "$dist.tar.gz" "$dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTCRig-v${{ steps.version.outputs.version }}-linux-x86_64
          path: BTCRig-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-ucrt64:
    name: Windows UCRT64 Package
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-jansson
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-opencl-headers

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBTC_MINER_NATIVE=OFF -DBTCRIG_OPENCL=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Smoke test
        run: |
          ./build/btc_stratum.exe --version
          ./build/btc_proxy.exe --version
          ./build/btc_bench.exe --version
          ./build/btc_stratum.exe --self-test
          ! objdump -p build/btc_stratum.exe | grep -qi "DLL Name: OpenCL.dll"
          ! objdump -p build/btc_bench.exe | grep -qi "DLL Name: OpenCL.dll"

      - name: Package
        run: |
          set -euo pipefail
          dist="BTCRig-v${{ steps.version.outputs.version }}-windows-ucrt64"
          rm -rf "$dist" "$dist.zip"
          mkdir -p "$dist"

          cp build/btc_stratum.exe "$dist/"
          cp build/btc_proxy.exe "$dist/"
          cp build/btc_bench.exe "$dist/"
          cp config.json proxy.json "$dist/"
          cp README.md README.zh-CN.md PROXY.md PROXY.zh-CN.md LICENSE VERSION "$dist/"

          ldd build/btc_stratum.exe build/btc_proxy.exe build/btc_bench.exe \
            | awk '{for (i=1; i<=NF; i++) if ($i ~ /^\/ucrt64\/bin\//) print $i}' \
            | sort -u \
            | while IFS= read -r dll; do
                if [ -n "$dll" ]; then
                  cp -u "$dll" "$dist/"
                fi
              done

          zip -r "$dist.zip" "$dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTCRig-v${{ steps.version.outputs.version }}-windows-ucrt64
          path: BTCRig-v${{ steps.version.outputs.version }}-windows-ucrt64.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux-x86_64
      - windows-ucrt64
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Detect release trigger
        id: release_trigger
        shell: bash
        run: |
          publish=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            publish="${{ github.event.inputs.publish_release || 'false' }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            before="${{ github.event.before }}"
            sha="${{ github.sha }}"
            if printf '%s' "$before" | grep -Eq '^0+$'; then
              publish=true
            elif git diff --name-only "$before" "$sha" | grep -Fxq VERSION; then
              publish=true
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        if: steps.release_trigger.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        if: steps.release_trigger.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BTCRig ${{ steps.version.outputs.tag }}
          body: |
            Automated packaged builds for BTCRig ${{ steps.version.outputs.tag }}.

            Package contents:
            - btc_stratum
            - btc_proxy
            - btc_bench
            - config.json
            - proxy.json
            - README, LICENSE, VERSION
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
