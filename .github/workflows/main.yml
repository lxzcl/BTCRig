name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the zip package to GitHub Releases"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - dev
    paths:
      - ".github/workflows/main.yml"
      - "src/**"
      - "CMakeLists.txt"
      - "VERSION"
      - "*.sh"
      - "*.json"
      - "README*.md"
      - "BUILD_*.md"
      - "PROXY*.md"
  pull_request:
    branches:
      - master
      - dev
    paths:
      - ".github/workflows/main.yml"
      - "src/**"
      - "CMakeLists.txt"
      - "VERSION"
      - "*.sh"
      - "*.json"
      - "README*.md"
      - "BUILD_*.md"
      - "PROXY*.md"

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            cppcheck \
            libjansson-dev \
            libssl-dev \
            ocl-icd-opencl-dev \
            opencl-headers \
            pkg-config \
            shellcheck

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBTC_MINER_NATIVE=ON -DBTCRIG_OPENCL=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Smoke test
        run: |
          ./build/btc_stratum --version
          ./build/btc_proxy --version
          ./build/btc_bench --version
          ./build/btc_stratum --self-test
          ./build/btc_stratum --cpu-info
          ./build/btc_bench -t 1 -s 1

      - name: Static checks
        run: |
          shellcheck -S warning ubuntu.sh termux.sh
          cppcheck --enable=warning --error-exitcode=1 \
            --std=c11 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=preprocessorErrorDirective \
            -I src src

  windows-ucrt64:
    name: Windows UCRT64
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Detect release trigger
        id: release_trigger
        shell: pwsh
        run: |
          $versionChanged = "false"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $versionChanged = "true"
          } elseif ("${{ github.event_name }}" -eq "push") {
            $before = "${{ github.event.before }}"
            $sha = "${{ github.sha }}"
            if ($before -match "^0+$") {
              $versionChanged = "true"
            } else {
              $changed = git diff --name-only $before $sha
              if ($changed -contains "VERSION") {
                $versionChanged = "true"
              }
            }
          }
          "version_changed=$versionChanged" >> $env:GITHUB_OUTPUT

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-jansson
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-opencl-headers
            mingw-w64-ucrt-x86_64-opencl-icd

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBTC_MINER_NATIVE=ON -DBTCRIG_OPENCL=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Smoke test
        run: |
          ./build/btc_stratum.exe --version
          ./build/btc_proxy.exe --version
          ./build/btc_bench.exe --version
          ./build/btc_stratum.exe --self-test
          ./build/btc_stratum.exe --cpu-info
          ldd build/btc_stratum.exe | grep -qi "opencl"
          ./build/btc_bench.exe -t 1 -s 1

      - name: Package
        run: |
          set -euo pipefail
          dist="BTCRig-v${{ steps.version.outputs.version }}-windows-ucrt64"
          rm -rf "$dist" "$dist.zip"
          mkdir -p "$dist"

          cp build/btc_stratum.exe "$dist/"
          cp build/btc_proxy.exe "$dist/"
          cp build/btc_bench.exe "$dist/"
          cp config.json proxy.json "$dist/"
          cp README.md README.zh-CN.md PROXY.md PROXY.zh-CN.md LICENSE VERSION "$dist/"

          ldd build/btc_stratum.exe build/btc_proxy.exe build/btc_bench.exe \
            | awk '{for (i=1; i<=NF; i++) if ($i ~ /^\/ucrt64\/bin\//) print $i}' \
            | sort -u \
            | while IFS= read -r dll; do
                if [ -n "$dll" ]; then
                  cp -u "$dll" "$dist/"
                fi
              done

          zip -r "$dist.zip" "$dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTCRig-v${{ steps.version.outputs.version }}-windows-ucrt64
          path: BTCRig-v${{ steps.version.outputs.version }}-windows-ucrt64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
          (github.event_name == 'push' &&
            github.ref == 'refs/heads/master' &&
            steps.release_trigger.outputs.version_changed == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BTCRig ${{ steps.version.outputs.tag }}
          body: |
            Automated Windows UCRT64 build for BTCRig ${{ steps.version.outputs.tag }}.

            Package contents:
            - btc_stratum.exe
            - btc_proxy.exe
            - btc_bench.exe
            - config.json
            - proxy.json
            - required UCRT64 DLL files
            - README, LICENSE, VERSION
          files: BTCRig-v${{ steps.version.outputs.version }}-windows-ucrt64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
